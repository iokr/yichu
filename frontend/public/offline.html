<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <meta name="theme-color" content="#A67C89" />
    <title>衣橱 · 离线</title>
    <style>
      :root {
        color-scheme: light dark;
      }
      body {
        margin: 0;
        min-height: 100vh;
        display: flex;
        align-items: center;
        justify-content: center;
        padding: 24px;
        background: #fafaf8;
        color: #1f1d1b;
        font-family: 'Inter', 'PingFang SC', 'Microsoft YaHei', system-ui, sans-serif;
      }
      @media (prefers-color-scheme: dark) {
        body {
          background: #141312;
          color: #f2f0ee;
        }
        .card {
          background: #1c1b1a;
          border-color: #2e2c2a;
        }
        .muted {
          color: #a8a39d;
        }
      }
      .card {
        max-width: 420px;
        padding: 32px;
        border: 1px solid #eae8e5;
        border-radius: 16px;
        background: #fff;
        text-align: center;
      }
      h1 {
        font-size: 20px;
        margin: 0 0 12px;
      }
      p {
        font-size: 14px;
        line-height: 1.6;
        color: #6b6661;
        margin: 0 0 20px;
      }
      button {
        height: 40px;
        padding: 0 20px;
        border: none;
        border-radius: 12px;
        background: #a67c89;
        color: #fff;
        font-size: 14px;
        cursor: pointer;
      }
    </style>
  </head>
  <body>
    <div class="card">
      <h1>当前离线</h1>
      <p>网络恢复后即可继续使用。已缓存的内容仍然可以浏览。</p>
      <button onclick="location.reload()">重新连接</button>
    </div>
  </body>
</html>
